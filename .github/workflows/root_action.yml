# =====
name: Root Continuous Context Ingestor

on:
  push:
    branches:
      - master  # 🔴 תוקן מ-main ל-master לפי הפרויקט שלך
  workflow_dispatch: # מאפשר הפעלה ידנית לצורך סריקה מלאה

jobs:
  update-context:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # קריטי: מאפשר לסוכן לעדכן את ROOT.md בעצמו
      issues: write    # קריטי: מאפשר פתיחת Issues על ידי ה-Critic

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # מוודא שה-AI יוכל לראות את ה-Diffs בין הגרסאות

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Cache Vector Memory
        uses: actions/cache@v4
        with:
          path: ./root_memory
          key: root-memory-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            root-memory-${{ runner.os }}-

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install openai python-dotenv numpy requests chromadb

      - name: Run Root Ingestor
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          UI_LANGUAGE: Hebrew  # 🔴 קריטי כדי שהסוכן ימשיך לפתוח Issues בעברית
        run: python ingestor.py

      - name: Commit and Push Manifest Changes
        run: |
          git config --local user.email "root-agent@github.com"
          git config --local user.name "Root-Agent"
          
          # סנכרון למניעת התנגשויות
          git pull origin master --rebase # 🔴 תוקן ל-master
          
          # דחיפת קובץ המניפסט והזיכרון
          git add ROOT.md memory.json || true
          git commit -m "🤖 Root: Auto-update Architecture Context & Memory [skip ci]" || echo "No changes to commit"
          git push origin HEAD:master --force # 🔴 תוקן ל-master
# =====
