[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "root-os"
version = "1.0.0"
description = "Adaptive Agentic OS for autonomous project documentation and strategy"
readme = "README.md"
authors = [{ name = "Root OS Team" }]
requires-python = ">=3.8"
dependencies = [
    "fastapi",
    "uvicorn",
    "pydantic",
    "watchdog",
    "openai",
    "requests",
    "python-dotenv"
]

[project.optional-dependencies]
# צופה פני עתיד: זה יותקן רק אם המשתמש יבקש את גרסת ה"מחשב/מפלצת"
full = [
    "chromadb",
    "numpy"
]

[project.scripts]
root = "root_os.boot:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["root_os*"]